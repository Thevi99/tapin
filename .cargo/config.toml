# Safety net (force = true: CI runners and dev shells may already set these):
# anything cargo runs (tests and every process they spawn) sees
# agent config homes inside target/, never the developer's real ~/.claude,
# ~/.codex or ~/.config/tapin. Tests that need a specific home set their own.
# (Added after a test reached a real ~/.codex/hooks.json; see CLAUDE.md.)
[env]
CLAUDE_CONFIG_DIR = { value = "target/test-isolation/claude", relative = true, force = true }
CODEX_HOME = { value = "target/test-isolation/codex", relative = true, force = true }
XDG_CONFIG_HOME = { value = "target/test-isolation/config", relative = true, force = true }
# Passive mode must not read the developer's live Claude sessions into tests.
TAPIN_CLAUDE_CMD = { value = "target/test-isolation/no-claude", relative = true, force = true }
TAPIN_PS_CMD = { value = "target/test-isolation/no-ps", relative = true, force = true }
GEMINI_CLI_HOME = { value = "target/test-isolation/gemini-home", relative = true, force = true }
