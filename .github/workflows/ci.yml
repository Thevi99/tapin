name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Test-only switches (#12) must never ship: they exist only under
      # debug_assertions, so the release binary must not even contain them.
      - name: Release binary has no test switches
        run: |
          # dist builds the released binaries; `cargo install` uses release.
          cargo build --profile dist
          cargo build --release
          for bin in target/dist/tapin target/release/tapin; do
            if strings "$bin" | grep -E 'TAPIN_TEST_|TAPIN_TRUST_PEER'; then
              echo "test-only switch found in $bin" >&2
              exit 1
            fi
          done
